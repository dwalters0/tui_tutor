<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>{{folder}}</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #090d14;
      --surface: #111824;
      --surface-hover: #172131;
      --text: #edf4ff;
      --muted: #9cabc0;
      --accent: #55d6be;
      --accent-soft: rgba(85, 214, 190, 0.12);
      --border: rgba(255, 255, 255, 0.09);
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(85, 214, 190, 0.1), transparent 28rem),
        radial-gradient(circle at 90% 15%, rgba(87, 126, 255, 0.1), transparent 30rem),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 5rem 0;
    }

    header {
      max-width: 760px;
      margin-bottom: 3rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0 0 1rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 1rem var(--accent);
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 4.8rem);
      line-height: 1.02;
      letter-spacing: -0.055em;
    }

    header p {
      max-width: 650px;
      margin: 1.4rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.15rem);
    }

    .topics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .card {
      position: relative;
      display: flex;
      min-height: 280px;
      flex-direction: column;
      overflow: hidden;
      padding: 1.65rem;
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.035), transparent), var(--surface);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 18px 45px var(--shadow);
      transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease;
    }

    .card::after {
      position: absolute;
      right: -4rem;
      bottom: -5rem;
      width: 11rem;
      height: 11rem;
      border-radius: 50%;
      background: var(--accent-soft);
      filter: blur(8px);
      content: "";
      transition: transform 180ms ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(85, 214, 190, 0.42);
      background-color: var(--surface-hover);
    }

    .card:hover::after {
      transform: scale(1.15);
    }

    .number {
      margin-bottom: 2rem;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.12em;
    }

    h2 {
      max-width: 22ch;
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.65rem);
      line-height: 1.22;
      letter-spacing: -0.025em;
    }

    .card p {
      position: relative;
      z-index: 1;
      margin: 1rem 0 1.75rem;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .read-more {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: auto;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .arrow {
      transition: transform 180ms ease;
    }

    .card:hover .arrow {
      transform: translateX(0.3rem);
    }

    .card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    footer {
      margin-top: 2.5rem;
      color: #728096;
      font-size: 0.85rem;
    }

    @media (max-width: 720px) {
      main {
        padding: 3.5rem 0;
      }

      .topics {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

    <body>
  <main>
<nav class="files">
    {% for unit_info in unit_infos %}
                <a class="card" href="/courses/{{ relative }}/{{ unit_info.directory }}/">
<!--                <span class="number">01 <span id=complete-02d26bcb-cc18-4463-80dd-2c5a9dca2549.html></span></span>-->
                <h2>{{ unit_info.name }}</h2>
                <p>Course: {{ unit_info.course_code }} {{ unit_info.course }}</p>
                <span class="read-more">Go to unit <span class="arrow" aria-hidden="true">→</span></span>
            </a>

    {% endfor %}
</nav>

    <footer>Generated by AI, take care not to trust blindly.</footer>
  </main>
</body>
</html>
